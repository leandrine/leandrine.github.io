<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .image-container {
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background: white;
            padding: 10px;
            border-radius: 8px;
        }
        
        img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }
        
        .caption {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Image: 20260328_122803.jpg</h1>
    
    <div class="image-container">
        <img src="20260328_122803.jpg" alt="Photo taken on 2026-03-28 at 12:28:03">
    </div>
    
    <p class="caption">Image: 20260328_122803.jpg</p>
</body>
</html>
