<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Presentation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            max-width: 90vw;
            max-height: 95vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
        }
        img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            display: block;
        }
        .caption {
            padding: 15px;
            color: #e0e0e0;
            text-align: center;
            font-size: 1rem;
            background-color: #1e1e1e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace 'image_cAFnyB.png' with the actual path to your image file -->
        <img src="20260328_122803.jpg" alt="Mural depicting the Virgin Mary with Salve Maria banner">
        <div class="caption">Salve Maria</div>
    </div>

</body>
</html>
